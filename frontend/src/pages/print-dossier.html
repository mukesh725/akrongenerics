<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Filled Application Dossier (Original PDFs) — Akron Generics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="src/js/pdf-lib.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1e293b;
  color: #f8fafc;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header Action Bar */
.topbar {
  background: #0f172a;
  border-bottom: 1px solid #334155;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 16px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-title {
  font-size: 14.5px;
  font-weight: 700;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-pill {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: #0d498f;
  color: #e0f2fe;
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 600;
}
.app-meta {
  font-size: 13px;
  color: #94a3b8;
}
.app-meta strong {
  color: #e2e8f0;
}

.action-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: #9e2235;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(158, 34, 53, 0.4);
}
.btn-primary:hover {
  background: #b72c38;
  transform: translateY(-1px);
}
.btn-blue {
  background: #0d498f;
  color: #ffffff;
}
.btn-blue:hover {
  background: #1459a8;
  transform: translateY(-1px);
}
.btn-subtle {
  background: #334155;
  color: #e2e8f0;
}
.btn-subtle:hover {
  background: #475569;
}

/* Loading Overlay */
#loadingOverlay {
  position: absolute;
  inset: 56px 0 0 0;
  background: #0b1329;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 50;
  transition: opacity 0.3s;
}
.spinner {
  width: 44px;
  height: 44px;
  border: 4px solid rgba(255, 255, 255, 0.15);
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-size: 15px;
  font-weight: 500;
  color: #cbd5e1;
}
.loading-sub {
  font-size: 12.5px;
  color: #64748b;
}

/* PDF Viewer Frame */
.viewer-container {
  flex: 1;
  position: relative;
  background: #525659;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-group">
    <div class="brand-title">
      <span>Akron Generics</span>
      <span class="brand-pill">Original 5-Page PDF Filled</span>
    </div>
    <div class="app-meta">
      Application: <strong id="topRefId">AKR-2026-Loading...</strong> &bull;
      Pharmacy: <strong id="topPharmName">Loading...</strong>
    </div>
  </div>

  <div class="action-group">
    <a href="dashboard.html" class="btn btn-subtle">⬅️ Representative Portal</a>
    <button class="btn btn-blue" id="btnDownloadPdf" onclick="downloadPdf()">📥 Download Original PDF</button>
    <button class="btn btn-primary" id="btnPrintPdf" onclick="printPdf()">🖨️ Print Application</button>
  </div>
</header>

<div class="viewer-container">
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Populating Official Akron Generics PDF Forms...</div>
    <div class="loading-sub">Filling Credit Application, Credit Card, ACH, Terms & Letter of Responsibility</div>
  </div>
  <iframe id="pdfFrame" title="Akron Generics Official Filled Application PDF"></iframe>
</div>

<script>
var currentBlobUrl = null;
var currentPdfBytes = null;
var currentRefId = 'AKR-2026-DOSSIER';
var currentPharmName = 'Pharmacy Account';

function getUrlParam(name) {
  var url = new URL(window.location.href);
  return url.searchParams.get(name);
}

async function init() {
  var refId = getUrlParam('id') || getUrlParam('ref') || 'AKR-2026-TEST';
  var autoprint = getUrlParam('autoprint') === '1';
  currentRefId = refId;
  document.getElementById('topRefId').textContent = refId;

  // 1. Try fetching from server API first
  var serverPdfUrl = '/api/download-official-pdf?id=' + encodeURIComponent(refId);

  try {
    var resp = await fetch(serverPdfUrl);
    if (resp.ok && resp.headers.get('content-type') && resp.headers.get('content-type').includes('pdf')) {
      var blob = await resp.blob();
      currentBlobUrl = URL.createObjectURL(blob);
      displayPdf(currentBlobUrl, autoprint);
      return;
    }
  } catch(e) {
    console.log("Server PDF endpoint not reachable, generating client-side via PDF-Lib:", e);
  }

  // 2. Client-side fallback via PDF-Lib
  await generateClientSidePdf(refId, autoprint);
}

function displayPdf(url, autoprint) {
  var frame = document.getElementById('pdfFrame');
  frame.src = url;
  document.getElementById('loadingOverlay').style.display = 'none';

  if (autoprint) {
    setTimeout(function() {
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch(err) {
        window.print();
      }
    }, 1200);
  }
}

async function generateClientSidePdf(refId, autoprint) {
  // Load data from localStorage
  var appData = null;
  try {
    var list = JSON.parse(localStorage.getItem('akron_submitted_applications') || '[]');
    appData = list.find(function(x) { return x.ref_id === refId; });
  } catch(e) {}

  if (!appData) {
    try {
      appData = JSON.parse(localStorage.getItem('akron_app_draft') || '{}');
    } catch(e) {}
  }

  if (!appData) {
    appData = {
      ref_id: refId,
      legalBusinessName: 'Akron Partner Pharmacy',
      pharmacyName: 'Akron Partner Pharmacy',
      billingAddress1: '100 Medical Center Parkway',
      billingCity: 'Commack',
      billingState: 'NY',
      billingZip: '11725',
      businessPhone: '(631) 215-3009',
      businessEmail: 'info@akrongenerics.com',
      authOfficerName: 'Supervising Pharmacist',
      authOfficerTitle: 'Owner / PIC',
      taxId: '11-2233445',
      salesManager: 'Main Account',
      signatureDate: new Date().toLocaleDateString()
    };
  }

  currentPharmName = appData.legalBusinessName || appData.pharmacyName || 'Pharmacy Account';
  document.getElementById('topPharmName').textContent = currentPharmName;

  try {
    // If server has on-the-fly endpoint, call it
    var genResp = await fetch('/api/generate-official-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    });
    if (genResp.ok) {
      var blob = await genResp.blob();
      currentBlobUrl = URL.createObjectURL(blob);
      displayPdf(currentBlobUrl, autoprint);
      return;
    }
  } catch(e) {}

  // Local PDFLib fallback
  try {
    if (window.PDFLib) {
      var PDFDocument = PDFLib.PDFDocument;
      var mergedPdf = await PDFDocument.create();

      var templates = [
        '../customer pdfs/Akron-Generics-Account-Set-Up-documents-Credit-Application.pdf',
        '../customer pdfs/Akron-Generics-Account-Set-Up-documents-Credit-Card-Authorization-form.pdf',
        '../customer pdfs/Akron-Generics-Account-Set-Up-documents-ACH-Payment-Authorization-Form.pdf',
        '../customer pdfs/Akron-Generics-Account-Set-Up-documents-Terms-and-Conditions-form.pdf',
        '../customer pdfs/Akron-Generics-Letter-of-Responsibility.pdf'
      ];

      for (var i = 0; i < templates.length; i++) {
        try {
          var tBytes = await fetch(templates[i]).then(function(r) { return r.arrayBuffer(); });
          var doc = await PDFDocument.load(tBytes);
          var form = doc.getForm();
          
          // Fill fields safely
          var bName = appData.legalBusinessName || appData.pharmacyName || '';
          try { form.getTextField('Business Name').setText(bName); } catch(e) {}
          try { form.getTextField('Pharmacy Name').setText(bName); } catch(e) {}
          try { form.getTextField('Customer Name').setText(bName); } catch(e) {}
          try { form.getTextField('Duly authorized for and on behalf of').setText(bName); } catch(e) {}
          try { form.getTextField('Address').setText(appData.billingAddress1 || appData.billingAddress || ''); } catch(e) {}
          try { form.getTextField('City').setText(appData.billingCity || ''); } catch(e) {}
          try { form.getTextField('State').setText(appData.billingState || ''); } catch(e) {}
          try { form.getTextField('Zip').setText(appData.billingZip || ''); } catch(e) {}
          try { form.getTextField('Phone Number').setText(appData.businessPhone || ''); } catch(e) {}
          try { form.getTextField('Email').setText(appData.businessEmail || ''); } catch(e) {}
          try { form.getTextField('Name').setText(appData.authOfficerName || ''); } catch(e) {}
          try { form.getTextField('Print Name').setText(appData.authOfficerName || ''); } catch(e) {}
          try { form.getTextField('TAX ID NUMBER').setText(appData.taxId || appData.ein || ''); } catch(e) {}
          try { form.getTextField('Date').setText(appData.signatureDate || new Date().toLocaleDateString()); } catch(e) {}

          var copiedPages = await mergedPdf.copyPages(doc, [0]);
          mergedPdf.addPage(copiedPages[0]);
        } catch(errPage) {
          console.log("Error loading template page:", errPage);
        }
      }

      var pdfBytes = await mergedPdf.save();
      var localBlob = new Blob([pdfBytes], { type: 'application/pdf' });
      currentBlobUrl = URL.createObjectURL(localBlob);
      displayPdf(currentBlobUrl, autoprint);
      return;
    }
  } catch(clientErr) {
    console.log("PDFLib local fallback error:", clientErr);
  }

  // If all fails, show notification
  document.getElementById('loadingOverlay').innerHTML = '<div style="color:#ef4444;font-size:16px;font-weight:600;">Unable to load PDF file. Please ensure server is running.</div>';
}

function downloadPdf() {
  if (!currentBlobUrl) {
    alert("PDF is still loading, please wait a moment.");
    return;
  }
  var a = document.createElement('a');
  a.href = currentBlobUrl;
  a.download = currentPharmName.replace(/[^a-zA-Z0-9_\-]/g, '_') + '_Akron_Generics_Official_Application_' + currentRefId + '.pdf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function printPdf() {
  var frame = document.getElementById('pdfFrame');
  try {
    frame.contentWindow.focus();
    frame.contentWindow.print();
  } catch(e) {
    window.open(currentBlobUrl, '_blank');
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
